name: Feature request
description: Propose a focused improvement to LEA
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful solution from a user's perspective.
    validations:
      required: true
  - type: textarea
    id: budget
    attributes:
      label: Cost and routing impact
      description: Would this add model calls, tokens, providers, or background work?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
