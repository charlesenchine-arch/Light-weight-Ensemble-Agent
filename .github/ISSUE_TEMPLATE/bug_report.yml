name: Bug report
description: Report reproducible behavior in LEA
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve LEA. Remove API keys and private prompt content.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest command or sequence that triggers the issue.
      placeholder: |
        1. Run `lea ...`
        2. Enter ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LEA version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.12.4
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste relevant output with credentials and private data removed.
      render: shell
