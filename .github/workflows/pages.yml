name: Deploy cost lab

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/lea-demo.gif"
      - "agentflow/benchmark.py"
      - "agentflow/catalog.py"
      - "agentflow/site_data.py"
      - "scripts/export_site_data.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build versioned benchmark data
        run: |
          python -m pip install -e .
          python scripts/export_site_data.py
          mkdir -p site/assets
          cp assets/lea-demo.gif site/assets/lea-demo.gif
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
