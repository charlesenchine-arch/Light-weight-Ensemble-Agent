[project]
name = "lea-agent"
version = "0.3.0"
description = "LEA — Light-weight Ensemble Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Agent-flow" }]
license = "Apache-2.0"
keywords = ["ai-agent", "coding-agent", "llm", "multi-model", "model-routing", "cost-optimization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "openai>=1.60.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "prompt_toolkit>=3.0.43",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2", "ruff>=0.9", "mcp>=2.1,<3"]
demo = ["pillow>=11.0"]
mcp = ["mcp>=2.1,<3"]

[project.urls]
Homepage = "https://github.com/charlesenchine-arch/Light-weight-Ensemble-Agent"
Documentation = "https://github.com/charlesenchine-arch/Light-weight-Ensemble-Agent#readme"
Issues = "https://github.com/charlesenchine-arch/Light-weight-Ensemble-Agent/issues"
Source = "https://github.com/charlesenchine-arch/Light-weight-Ensemble-Agent"

[project.scripts]
agentflow = "agentflow.cli:main"
lea = "agentflow.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentflow*"]

[tool.setuptools.package-data]
agentflow = ["defaults.yaml", "env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
